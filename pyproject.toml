[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singalign"
version = "0.1.0"
description = "Reproducible research tools for preference-aligned singing voice synthesis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Moses Kim" }]
dependencies = [
  # MLflow's WSGI bridge still imports anyio.from_thread.
  "anyio==4.14.2",
  "mlflow==3.15.2",
  "pyyaml==6.0.3",
  "scipy==1.16.3",
  "torch==2.8.0",
]

[project.scripts]
singalign-data = "singalign.cli:main"
singalign-align = "singalign.align:main"
singalign-compare = "singalign.compare:main"
singalign-evaluate = "singalign.evaluate:main"
singalign-track = "singalign.tracking:main"
singalign-train = "singalign.train:main"
singalign-conditioned-train = "singalign.conditioned_train:main"
singalign-vocoder-train = "singalign.vocoder_train:main"
singalign-vocoder-evaluate = "singalign.vocoder_evaluate:main"
singalign-candidates = "singalign.candidate_report:main"
singalign-kto-train = "singalign.kto_train:main"

[dependency-groups]
dev = ["ruff==0.12.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
