services:
  mlflow:
    build:
      context: .
      args:
        GIT_REVISION: ${SINGALIGN_GIT_REVISION:-unknown}
        GIT_DIRTY: ${SINGALIGN_GIT_DIRTY:-unknown}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/state/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./.mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  research:
    build:
      context: .
      args:
        GIT_REVISION: ${SINGALIGN_GIT_REVISION:-unknown}
        GIT_DIRTY: ${SINGALIGN_GIT_DIRTY:-unknown}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/workspace/data:ro
      - ./experiments:/workspace/experiments
      - ./reports:/workspace/reports
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      mlflow:
        condition: service_healthy
