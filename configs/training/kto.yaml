experiment:
  name: singalign-kto-proxy
  run_name: kto-synthetic-proxy
  run_kind: exploratory

objective:
  method: kto_proxy
  beta: 0.1
  kl_baseline: 0.0
  temperature: 0.1

data:
  source: synthetic_preference_pairs
  split: train_validation
  seed: 2026

training:
  epochs: 10
  batch_size: 4
  learning_rate: 0.0001
  device: auto
  checkpoint_dir: checkpoints/kto

preferences:
  chosen_severity: 0.03
  rejected_severity: 0.12
